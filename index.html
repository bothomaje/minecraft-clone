<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="style.css" rel="stylesheet" />
    <title>Minecraft Clone</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="toolbar-container">
      <div id="toolbar">
        <img
          class="toolbar-icon"
          id="toolbar-1"
          src="/textures/block/grass_block_side.png"
        />
        <img
          class="toolbar-icon"
          id="toolbar-2"
          src="/textures/block/dirt.png"
        />
        <img
          class="toolbar-icon"
          id="toolbar-3"
          src="/textures/block/stone.png"
        />
        <img
          class="toolbar-icon"
          id="toolbar-4"
          src="/textures/block/coal_ore.png"
        />
        <img
          class="toolbar-icon"
          id="toolbar-5"
          src="/textures/block/iron_ore.png"
        />
        <img
          class="toolbar-icon"
          id="toolbar-6"
          src="/textures/block/oak_log_top.png"
        />
        <img
          class="toolbar-icon"
          id="toolbar-7"
          src="/textures/block/oak_leaves.png"
        />
        <img
          class="toolbar-icon"
          id="toolbar-8"
          src="/textures/block/sand.png"
        />
        <img
          class="toolbar-icon selected"
          id="toolbar-0"
          src="/textures/item/iron_pickaxe.png"
        />
      </div>
    </div>
    <div id="info">
      <div id="player-position"></div>
    </div>
    <div id="status"></div>
    <script type="module" src="/scripts/main.js"></script>
  </body>
</html>
